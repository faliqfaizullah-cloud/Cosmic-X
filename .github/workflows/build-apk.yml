name: Build APK

on:
  push:
    tags: ['v*']          # git tag v1.0.0 && git push --tags  ->  GitHub Release with the APK
  workflow_dispatch:      # or run manually from the Actions tab (APK is attached as an artifact)

permissions:
  contents: write         # needed to create the Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests (tag parser)
        run: npm test

      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          node scripts/apply-android-assets.mjs
          npx cap sync android

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Signing with your release keystore"
            ./gradlew assembleRelease --no-daemon
            UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n1)
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEY_PASS="${KEY_PASS:-$KS_PASS}"
            "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --out "$GITHUB_WORKSPACE/CosmicX-${APP_VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
          else
            echo "No keystore secrets found - building an installable debug-signed APK"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CosmicX-${APP_VERSION}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CosmicX-apk
          path: CosmicX-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CosmicX-*.apk
          generate_release_notes: true
