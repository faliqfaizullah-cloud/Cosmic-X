<!doctype html>
<html lang="en" data-mode="portrait">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Cosmic X</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- shared directional motion-blur filters (strength is set from JS while things move) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="mbx" x="-10%" y="-5%" width="120%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mby" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>
  </svg>

  <div id="app">
    <div id="aura" aria-hidden="true"><i></i><i></i><i></i></div>
    <canvas id="sprinkles"></canvas>

    <!-- Portrait: the Cosmic X UI -->
    <main id="portrait">
      <header id="topbar">
        <h1 id="title">Menu</h1>
        <button id="titleBtn" aria-label="Switch screen"></button>
        <nav id="switcher" hidden></nav>
      </header>
      <section id="stage"></section>
      <footer id="dock">
        <button id="btnClose" class="round dark" aria-label="Close"></button>
        <button id="btnEdit" class="pill">Edit</button>
        <button id="btnAdd" class="round light" aria-label="Action"></button>
      </footer>
    </main>

    <!-- Landscape: iOS 4 style Cover Flow -->
    <section id="coverflow" aria-label="Cover Flow"></section>
  </div>

  <div id="toast" role="status"></div>
  <div id="ring" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
